<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMind AI - Live Scores & AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-red-500 selection:text-white">
    <!-- Top Navigation -->
    <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🧠</span>
                <span class="text-lg font-bold tracking-tight text-white">MatchMind <span class="text-red-500">AI Hub</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-500/20">💎 150 pts</span>
                <a href="/dashboard.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg transition-colors border border-slate-700/50">Dashboard ↗</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Sport Filters -->
        <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-4">
            <button onclick="switchTab('all')" class="sport-tab px-4 py-2 rounded-lg text-sm font-medium bg-red-600 text-white transition-all shadow-lg shadow-red-600/20">ყველა</button>
            <button onclick="switchTab('football')" class="sport-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 transition-all border border-slate-800">⚽ ფეხბურთი</button>
            <button onclick="switchTab('ufc')" class="sport-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 transition-all border border-slate-800">🥊 UFC / MMA</button>
            <button onclick="switchTab('f1')" class="sport-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 transition-all border border-slate-800">🏎️ Formula 1</button>
        </div>

        <!-- Content Sections Container -->
        <div class="space-y-6" id="sports-container">
            <div class="text-slate-500 text-sm py-12 text-center animate-pulse">იტვირთება Flashscore პანელი...</div>
        </div>
    </main>

    <footer class="border-t border-slate-800/80 mt-16 py-6 text-center text-xs text-slate-500">
        MatchMind AI Platform © 2026. Integrated with Archbot Telegram ecosystem.
    </footer>

    <script>
    let globalData = null;

    async function loadData() {
        try {
            const res = await fetch('/api/sports/live');
            const json = await res.json();
            if (json.status === 'success') {
                globalData = json.data;
                renderView('all');
            }
        } catch(e) {
            console.error("Error loading data:", e);
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.sport-tab').forEach(btn => {
            btn.classList.remove('bg-red-600', 'text-white', 'shadow-lg', 'shadow-red-600/20');
            btn.classList.add('bg-slate-900', 'text-slate-300', 'border', 'border-slate-800');
        });
        event.currentTarget.classList.remove('bg-slate-900', 'text-slate-300', 'border', 'border-slate-800');
        event.currentTarget.classList.add('bg-red-600', 'text-white', 'shadow-lg', 'shadow-red-600/20');

        renderView(tab);
    }

    function renderView(filter) {
        if (!globalData) return;
        let html = '';

        // Football Section
        if ((filter === 'all' || filter === 'football') && globalData.football) {
            html += `
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="bg-slate-800/60 px-4 py-3 text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center justify-between border-b border-slate-800">
                        <span>⚽ ფეხბურთი • ლაივ ტურები & შედეგები</span>
                        <span class="text-emerald-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Feed</span>
                    </div>
                    <div class="divide-y divide-slate-800/60">
                        ${globalData.football.map(m => `
                            <div class="px-4 py-3.5 flex items-center justify-between hover:bg-slate-800/40 transition-colors text-sm">
                                <div class="w-1/4">
                                    <span class="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 font-mono border border-slate-700/50">${m.league}</span>
                                </div>
                                <div class="flex items-center justify-center space-x-4 w-2/4 text-center">
                                    <span class="font-medium text-white text-right flex-1 truncate">${m.home}</span>
                                    <span class="px-3 py-1 bg-slate-950 rounded-lg font-bold text-amber-400 font-mono text-xs border border-slate-800">${m.score}</span>
                                    <span class="font-medium text-white text-left flex-1 truncate">${m.away}</span>
                                </div>
                                <div class="w-1/4 text-right">
                                    <span class="text-xs px-2.5 py-1 rounded-md font-semibold ${m.status === 'FT' ? 'bg-slate-800 text-slate-400 border border-slate-700/50' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 animate-pulse'}">${m.status}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // UFC Section
        if ((filter === 'all' || filter === 'ufc') && globalData.ufc) {
            html += `
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="bg-slate-800/60 px-4 py-3 text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center justify-between border-b border-slate-800">
                        <span>🥊 UFC / MMA • მომავალი ბრძოლების ბარათი & AI შანსები</span>
                        <span class="text-red-400 font-semibold flex items-center gap-1">⚡ AI Analytics</span>
                    </div>
                    <div class="divide-y divide-slate-800/60">
                        ${globalData.ufc.map(u => `
                            <div class="p-4 space-y-3.5 hover:bg-slate-800/40 transition-colors">
                                <div class="flex justify-between items-center text-xs text-slate-400">
                                    <span class="font-bold text-red-400 tracking-wide">${u.event}</span>
                                    <span class="px-2 py-0.5 bg-slate-950 rounded border border-slate-800 font-mono">${u.weight}</span>
                                </div>
                                <div class="flex justify-between items-center text-sm font-semibold py-1">
                                    <span class="text-white flex-1 text-center truncate px-2">${u.fighter_a}</span>
                                    <span class="px-3 text-slate-500 font-black text-xs tracking-widest bg-slate-950/80 py-1 rounded border border-slate-800">VS</span>
                                    <span class="text-white flex-1 text-center truncate px-2">${u.fighter_b}</span>
                                </div>
                                <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800/80 space-y-2">
                                    <div class="flex justify-between text-xs text-slate-400 font-medium">
                                        <span class="text-red-400">${u.fighter_a} (${u.prob_a}%)</span>
                                        <span class="text-slate-500 uppercase tracking-wider text-[10px]">AI Win Probability</span>
                                        <span class="text-sky-400">${u.fighter_b} (${u.prob_b}%)</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden flex p-0.5 border border-slate-800">
                                        <div class="bg-gradient-to-r from-red-600 to-red-500 h-full rounded-l-full transition-all duration-500" style="width: ${u.prob_a}%"></div>
                                        <div class="bg-gradient-to-r from-sky-500 to-sky-600 h-full rounded-r-full transition-all duration-500" style="width: ${u.prob_b}%"></div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // F1 Section
        if ((filter === 'all' || filter === 'f1') && globalData.f1) {
            html += `
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="bg-slate-800/60 px-4 py-3 text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center justify-between border-b border-slate-800">
                        <span>🏎️ Formula 1 • დრაივერების ცხრილი</span>
                        <span class="text-amber-400 font-semibold">Standings</span>
                    </div>
                    <div class="divide-y divide-slate-800/60">
                        ${globalData.f1.map(f => `
                            <div class="px-4 py-3.5 flex items-center justify-between text-sm hover:bg-slate-800/40 transition-colors">
                                <div class="flex items-center space-x-3.5 w-1/3">
                                    <span class="w-7 text-center font-extrabold text-amber-400 bg-amber-500/10 py-1 rounded border border-amber-500/20 font-mono text-xs">P${f.pos}</span>
                                    <span class="font-semibold text-white truncate">${f.driver}</span>
                                </div>
                                <div class="w-1/3 text-center text-xs text-slate-400 font-medium">${f.team}</div>
                                <div class="w-1/3 text-right flex items-center justify-end space-x-3">
                                    <span class="text-xs text-slate-400 font-mono">${f.time}</span>
                                    <span class="px-3 py-1 bg-slate-950 rounded-lg font-bold text-amber-400 font-mono text-xs border border-slate-800 shadow-inner">${f.pts} pts</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        document.getElementById('sports-container').innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
