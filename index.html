<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Archbot AI</title>
    <style>
        :root { --bg-primary: #0f172a; --bg-sidebar: #1e293b; --text-main: #f8fafc; --accent: #6366f1; }
        body { margin: 0; font-family: sans-serif; background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; }
        aside { width: 260px; background-color: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 1.25rem; font-weight: bold; margin-bottom: 30px; letter-spacing: 1px; }
        nav a { display: block; color: #94a3b8; text-decoration: none; padding: 10px 15px; border-radius: 6px; margin-bottom: 8px; transition: 0.2s; }
        nav a:hover, nav a.active { background-color: var(--accent); color: white; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        select { background: var(--bg-sidebar); color: var(--text-main); border: 1px solid #334155; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <aside>
        <div>
            <div class="logo">ARCHBOT AI</div>
            <nav>
                <a href="#" class="active" data-translate="nav_dashboard">მთავარი & ჩატი</a>
                <a href="#" data-translate="nav_market">ოქრო & მარკეტი</a>
                <a href="#" data-translate="nav_realestate">უძრავი ქონება</a>
                <a href="#" data-translate="nav_celery">Celery Tasks</a>
            </nav>
        </div>
        <div>
            <select id="langSwitch" onchange="switchLanguage(this.value)">
                <option value="ka" selected>ქართული</option>
                <option value="en">English</option>
            </select>
        </div>
    </aside>
    <main>
        <h1 id="pageTitle">მთავარი პანელი</h1>
        <p id="welcomeText">მოგესალმებით! მე ვარ Archbot AI, თქვენი ინტელექტუალური ასისტენტი.</p>
    </main>
    <script>
        const translations = {
            ka: {
                nav_dashboard: "მთავარი & ჩატი",
                nav_market: "ოქრო & მარკეტი",
                nav_realestate: "უძრავი ქონება",
                nav_celery: "Celery Tasks",
                title: "მთავარი პანელი",
                welcome: "მოგესალმებით! მე ვარ Archbot AI, თქვენი ინტელექტუალური ასისტენტი."
            },
            en: {
                nav_dashboard: "Dashboard & Chat",
                nav_market: "Gold & Market",
                nav_realestate: "Real Estate Search",
                nav_celery: "Celery Tasks",
                title: "Dashboard",
                welcome: "Hello! I am Archbot AI, your intelligent market and real estate assistant."
            }
        };

        function switchLanguage(lang) {
            document.querySelectorAll("[data-translate]").forEach(el => {
                const key = el.getAttribute("data-translate");
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.getElementById("pageTitle").textContent = translations[lang].title;
            document.getElementById("welcomeText").textContent = translations[lang].welcome;
            document.documentElement.lang = lang;
        }
    </script>
</body>
</html>
