<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>MatchMind AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🧠</span>
            <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">MatchMind AI Hub</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full text-sm font-semibold">💎 150 pts</span>
            <a href="/" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition">მთავარი Archbot</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- Sport Selector -->
        <div class="flex space-x-4 mb-6">
            <button onclick="setSport('football')" id="btn-football" class="px-5 py-2.5 rounded-xl font-semibold bg-cyan-600 text-white shadow-lg transition">⚽ ფეხბურთი</button>
            <button onclick="setSport('ufc')" id="btn-ufc" class="px-5 py-2.5 rounded-xl font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">🥊 UFC / MMA</button>
            <button onclick="setSport('f1')" id="btn-f1" class="px-5 py-2.5 rounded-xl font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">🏎️ Formula 1</button>
        </div>

        <!-- Status / Sub-tabs: Live, Upcoming, Finished -->
        <div class="flex space-x-3 mb-6 border-b border-slate-800 pb-4">
            <button onclick="setStatus('live')" id="sub-live" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-red-600/20 text-red-400 border border-red-500/30">🔴 ლაივში</button>
            <button onclick="setStatus('upcoming')" id="sub-upcoming" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-400">📅 მომავალი</button>
            <button onclick="setStatus('finished')" id="sub-finished" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-400">🏁 ჩატარებული</button>
        </div>

        <!-- Content Area -->
        <div id="content-area" class="space-y-4">
            <div class="text-center py-12 text-slate-500">იტვირთება მონაცემები...</div>
        </div>
    </main>

    <script>
        let currentSport = "football";
        let currentStatus = "live";
        let cachedData = null;

        async function loadData() {
            try {
                const res = await fetch("/api/sports/live");
                const json = await res.json();
                if (json.status === "success") {
                    cachedData = json.data;
                    render();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function setSport(sport) {
            currentSport = sport;
            document.querySelectorAll("[id^='btn-']").forEach(b => {
                b.className = "px-5 py-2.5 rounded-xl font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition";
            });
            document.getElementById("btn-" + sport).className = "px-5 py-2.5 rounded-xl font-semibold bg-cyan-600 text-white shadow-lg transition";
            render();
        }

        function setStatus(status) {
            currentStatus = status;
            ["live", "upcoming", "finished"].forEach(s => {
                const el = document.getElementById("sub-" + s);
                if (s === status) {
                    el.className = "px-4 py-1.5 rounded-lg text-sm font-medium bg-cyan-950 text-cyan-400 border border-cyan-500/30";
                } else {
                    el.className = "px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-400";
                }
            });
            render();
        }

        function render() {
            if (!cachedData) return;
            const area = document.getElementById("content-area");
            area.innerHTML = "";

            if (currentSport === "f1") {
                const f1List = cachedData.f1 || [];
                if (f1List.length === 0) {
                    area.innerHTML = '<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 text-center text-slate-400">F1 მონაცემები არ მოიძებნა.</div>';
                    return;
                }
                let html = '<div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden"><table class="w-full text-left border-collapse">';
                html += '<tr class="bg-slate-800/50 text-slate-400 text-xs uppercase tracking-wider"><th class="p-4">Pos</th><th class="p-4">Driver</th><th class="p-4">Team</th><th class="p-4">Session</th></tr>';
                f1List.forEach(item => {
                    html += `<tr class="border-t border-slate-800/60 hover:bg-slate-800/30">
                        <td class="p-4 font-bold text-cyan-400">#${item.pos}</td>
                        <td class="p-4 font-semibold">${item.driver}</td>
                        <td class="p-4 text-slate-400">${item.team}</td>
                        <td class="p-4 text-slate-500 text-sm">${item.session}</td>
                    </tr>`;
                });
                html += '</table></div>';
                area.innerHTML = html;
                return;
            }

            const sportObj = cachedData[currentSport];
            if (!sportObj) return;
            const items = sportObj[currentStatus] || [];

            if (items.length === 0) {
                area.innerHTML = '<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 text-center text-slate-400">მონაცემები ამ კატეგორიაში არ არის.</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm hover:border-slate-700 transition flex flex-col gap-3";
                
                const titleOrLeague = item.league || item.event || "Match";
                const teamA = item.home || item.fighter_a || "Team A";
                const teamB = item.away || item.fighter_b || "Team B";
                const scoreOrTime = item.score || item.time || "vs";
                const hProb = item.home_prob || 50;
                const aProb = item.away_prob || 50;

                let goalsHtml = "";
                if (currentSport === "football" && item.ov15 !== undefined) {
                    goalsHtml = `
                        <div class="mt-3 pt-3 border-t border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                            <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800 flex justify-between items-center">
                                <span class="text-slate-400 font-medium">⚽ გოლები Over / Under 1.5</span>
                                <span class="text-slate-200"><strong class="text-cyan-400">Over: ${item.ov15}%</strong> | <strong class="text-indigo-400">Under: ${item.un15}%</strong></span>
                            </div>
                            <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800 flex justify-between items-center">
                                <span class="text-slate-400 font-medium">⚽ გოლები Over / Under 2.5</span>
                                <span class="text-slate-200"><strong class="text-cyan-400">Over: ${item.ov25}%</strong> | <strong class="text-indigo-400">Under: ${item.un25}%</strong></span>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="w-full md:w-1/4">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-slate-300">${titleOrLeague}</span>
                            <div class="text-xs text-slate-500 mt-2">${item.date || ""} ${item.time || ""}</div>
                        </div>
                        <div class="w-full md:w-2/4 flex items-center justify-between px-4">
                            <div class="text-right w-5/12 font-bold text-slate-200 truncate">${teamA}</div>
                            <div class="w-2/12 text-center font-extrabold text-cyan-400 bg-slate-950 py-1.5 px-3 rounded-lg border border-slate-800 text-sm">${scoreOrTime}</div>
                            <div class="text-left w-5/12 font-bold text-slate-200 truncate">${teamB}</div>
                        </div>
                        <div class="w-full md:w-1/4 bg-slate-950/60 p-3 rounded-lg border border-slate-800/80 text-xs">
                            <div class="flex justify-between text-slate-400 mb-1 font-semibold">
                                <span>AI Win Prob</span>
                                <span class="text-cyan-400">${hProb}% / ${aProb}%</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex">
                                <div class="bg-cyan-500 h-full" style="width: ${hProb}%"></div>
                                <div class="bg-indigo-500 h-full" style="width: ${aProb}%"></div>
                            </div>
                        </div>
                    </div>
                    ${goalsHtml}
                `;
                area.appendChild(card);
            });
        }

        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
