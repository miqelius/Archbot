<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <title>MatchMind AI Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-100">MatchMind AI Hub</h1>
                <p class="text-xs text-slate-400 mt-0.5">სპორტული ანალიტიკა და კოეფიციენტების მონიტორინგი</p>
            </div>
            <div id="status-badge" class="text-xs px-3 py-1 bg-emerald-950/60 text-emerald-400 rounded-full border border-emerald-800/50 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Sync
            </div>
        </header>

        <!-- Sports Category Tabs -->
        <div class="flex gap-3 mb-6 overflow-x-auto pb-2">
            <button onclick="setSport('football')" id="tab-football" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white transition shadow-sm">ფეხბურთი</button>
            <button onclick="setSport('ufc')" id="tab-ufc" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">UFC / MMA</button>
            <button onclick="setSport('f1')" id="tab-f1" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">Formula 1</button>
        </div>

        <!-- Sub-status Tabs -->
        <div class="flex gap-2 mb-6 border-b border-slate-900 pb-4">
            <button onclick="setStatus('upcoming')" id="sub-upcoming" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-white transition">მომავალი</button>
            <button onclick="setStatus('live')" id="sub-live" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">ლაივი</button>
            <button onclick="setStatus('finished')" id="sub-finished" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">დასრულებული</button>
        </div>

        <!-- Content Container -->
        <div id="content-area" class="space-y-3">
            <div class="text-center py-16 text-slate-500 text-sm animate-pulse">მონაცემები იტვირთება...</div>
        </div>
    </div>

    <script>
        let currentSport = 'football';
        let currentStatus = 'upcoming';
        let globalData = null;

        async function loadData() {
            try {
                let res = await fetch('/api/sports/live');
                let json = await res.json();
                if(json.status === 'success') {
                    globalData = json.data;
                    render();
                }
            } catch(e) {
                console.error("Fetch error:", e);
            }
        }

        function setSport(sport) {
            currentSport = sport;
            ['football', 'ufc', 'f1'].forEach(s => {
                let btn = document.getElementById(`tab-${s}`);
                if(s === sport) {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white transition shadow-sm";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition";
                }
            });
            render();
        }

        function setStatus(status) {
            currentStatus = status;
            ['upcoming', 'live', 'finished'].forEach(s => {
                let btn = document.getElementById(`sub-${s}`);
                if(btn) {
                    if(s === status) {
                        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-white transition";
                    } else {
                        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition";
                    }
                }
            });
            render();
        }

        function render() {
            let container = document.getElementById('content-area');
            if(!globalData) return;

            if(currentSport === 'f1') {
                let f1List = globalData.f1 || [];
                if(f1List.length === 0) {
                    container.innerHTML = `<div class="p-6 bg-slate-900/40 rounded-xl border border-slate-900 text-center text-slate-500 text-sm">მონაცემები არ არის.</div>`;
                    return;
                }
                container.innerHTML = f1List.map(item => `
                    <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-900 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 rounded">${item.circuit}</span>
                            <h3 class="font-medium mt-1.5 text-sm">${item.driver}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">${item.team}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-500 block">პოზიცია</span>
                            <span class="text-lg font-bold text-amber-400">P${item.pos}</span>
                        </div>
                    </div>
                `).join('');
                return;
            }

            let sportObj = globalData[currentSport];
            let list = sportObj ? (sportObj[currentStatus] || []) : [];

            if(list.length === 0) {
                container.innerHTML = `<div class="p-6 bg-slate-900/40 rounded-xl border border-slate-900 text-center text-slate-500 text-sm">ინფორმაცია არ მოიძებნა.</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                let badgeText = currentSport === 'ufc' ? item.event : (item.league || 'Match');
                let sideA = currentSport === 'ufc' ? item.fighter_a : item.home;
                let sideB = currentSport === 'ufc' ? item.fighter_b : item.away;
                let scoreDisplay = item.score || (currentStatus === 'finished' ? 'FT' : 'VS');

                return `
                    <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-900 flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-800 transition">
                        <div class="w-full md:w-1/4">
                            <span class="text-[10px] px-2 py-0.5 bg-slate-800/80 text-slate-300 rounded border border-slate-800">${badgeText}</span>
                            <div class="text-[11px] text-slate-500 mt-1.5">${item.date || ''} ${item.time || ''}</div>
                        </div>
                        
                        <div class="flex items-center gap-3 font-medium text-sm md:text-base w-full md:w-2/4 justify-center text-center">
                            <span class="flex-1 text-right truncate text-slate-200">${sideA}</span>
                            <span class="px-3 py-1 bg-slate-950 text-amber-400 text-xs rounded-lg border border-slate-900 font-bold">${scoreDisplay}</span>
                            <span class="flex-1 text-left truncate text-slate-200">${sideB}</span>
                        </div>

                        <div class="w-full md:w-1/4 text-right">
                            <div class="text-[11px] font-medium text-slate-400">
                                <span class="text-slate-200">${item.home_prob}%</span> <span class="text-amber-400 font-bold">[${item.home_odd}]</span> 
                                <span class="text-slate-700 mx-1">/</span> 
                                <span class="text-slate-200">${item.away_prob}%</span> <span class="text-amber-400 font-bold">[${item.away_odd}]</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadData();
        setInterval(loadData, 20000);
    </script>
</body>
</html>
