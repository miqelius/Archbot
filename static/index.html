<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <title>MatchMind AI Hub - Live Sports & UFC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">MatchMind AI Hub</h1>
                <p class="text-xs text-slate-400 mt-1">რეალური დროის სპორტული ანალიტიკა და UFC ბრძანებები</p>
            </div>
            <div id="status-badge" class="text-xs px-3 py-1 bg-emerald-950 text-emerald-400 rounded-full border border-emerald-800 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Synced
            </div>
        </header>

        <!-- Sports Category Tabs -->
        <div class="flex gap-4 mb-6 overflow-x-auto pb-2">
            <button onclick="setSport('football')" id="tab-football" class="px-5 py-2.5 rounded-xl font-medium bg-blue-600 text-white transition shadow-lg shadow-blue-600/20">⚽ ფეხბურთი</button>
            <button onclick="setSport('ufc')" id="tab-ufc" class="px-5 py-2.5 rounded-xl font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">🥊 UFC / MMA</button>
            <button onclick="setSport('f1')" id="tab-f1" class="px-5 py-2.5 rounded-xl font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">🏎️ Formula 1</button>
        </div>

        <!-- Sub-status Tabs (Upcoming / Live / Finished) -->
        <div class="flex gap-3 mb-6">
            <button onclick="setStatus('upcoming')" id="sub-upcoming" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-white transition">მომავალი</button>
            <button onclick="setStatus('live')" id="sub-live" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">ლაივში</button>
            <button onclick="setStatus('finished')" id="sub-finished" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition">ჩატარებული (გუშინდელი)</button>
        </div>

        <!-- Content Container -->
        <div id="content-area" class="space-y-4">
            <div class="text-center py-16 text-slate-500 animate-pulse">მონაცემები იტვირთება...</div>
        </div>
    </div>

    <script>
        let currentSport = 'football';
        let currentStatus = 'upcoming';
        let globalData = null;

        async function loadData() {
            try {
                let res = await fetch('/api/sports/live');
                let json = await res.json();
                if(json.status === 'success') {
                    globalData = json.data;
                    render();
                }
            } catch(e) {
                console.error("Fetch error:", e);
            }
        }

        function setSport(sport) {
            currentSport = sport;
            ['football', 'ufc', 'f1'].forEach(s => {
                let btn = document.getElementById(`tab-${s}`);
                if(s === sport) {
                    btn.className = "px-5 py-2.5 rounded-xl font-medium bg-blue-600 text-white transition shadow-lg shadow-blue-600/20";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition";
                }
            });
            render();
        }

        function setStatus(status) {
            currentStatus = status;
            ['upcoming', 'live', 'finished'].forEach(s => {
                let btn = document.getElementById(`sub-${s}`);
                if(btn) {
                    if(s === status) {
                        btn.className = "px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-white transition";
                    } else {
                        btn.className = "px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-900 text-slate-400 hover:bg-slate-800 transition";
                    }
                }
            });
            render();
        }

        function render() {
            let container = document.getElementById('content-area');
            if(!globalData) return;

            // Formula 1 View
            if(currentSport === 'f1') {
                let f1List = globalData.f1 || [];
                if(f1List.length === 0) {
                    container.innerHTML = `<div class="p-8 bg-slate-900/50 rounded-2xl border border-slate-800 text-center text-slate-400">F1 მონაცემები ამჟამად მიუწვდომელია.</div>`;
                    return;
                }
                container.innerHTML = f1List.map(item => `
                    <div class="p-4 bg-slate-900/50 rounded-2xl border border-slate-800 flex justify-between items-center">
                        <div>
                            <span class="text-xs px-2.5 py-1 bg-red-950 text-red-400 rounded-md border border-red-900/50">${item.circuit}</span>
                            <h3 class="font-semibold mt-2 text-base">${item.driver}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">${item.team} (${item.session})</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 block mb-1">პოზიცია</span>
                            <span class="text-xl font-bold text-amber-400">P ${item.pos}</span>
                        </div>
                    </div>
                `).join('');
                return;
            }

            // Football & UFC View
            let sportObj = globalData[currentSport];
            let list = sportObj ? (sportObj[currentStatus] || []) : [];

            if(list.length === 0) {
                container.innerHTML = `<div class="p-8 bg-slate-900/50 rounded-2xl border border-slate-800 text-center text-slate-400">ამ კატეგორიაში ინფორმაცია არ მოიძებნა.</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                let badgeText = currentSport === 'ufc' ? item.event : (item.league || 'Match');
                let sideA = currentSport === 'ufc' ? item.fighter_a : item.home;
                let sideB = currentSport === 'ufc' ? item.fighter_b : item.away;
                let scoreDisplay = item.score || (currentStatus === 'finished' ? 'FT' : 'VS');

                return `
                    <div class="p-5 bg-slate-900/50 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-700 transition">
                        <div class="w-full md:w-1/4">
                            <span class="text-xs px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md border border-slate-700">${badgeText}</span>
                            <div class="text-xs text-slate-400 mt-2">📅 ${item.date || ''} ${item.time ? '⏰ ' + item.time : ''}</div>
                        </div>
                        
                        <div class="flex items-center gap-4 font-semibold text-base md:text-lg w-full md:w-2/4 justify-center text-center">
                            <span class="flex-1 text-right truncate">${sideA}</span>
                            <span class="px-3.5 py-1.5 bg-slate-950 text-amber-400 text-xs rounded-xl border border-slate-800 tracking-wider font-bold shadow-inner">${scoreDisplay}</span>
                            <span class="flex-1 text-left truncate">${sideB}</span>
                        </div>

                        <div class="w-full md:w-1/4 text-right">
                            <div class="text-xs text-slate-400 mb-1">AI პროგნოზი & კოეფიციენტები</div>
                            <div class="text-sm font-semibold">
                                ${item.home_prob}% <span class="text-xs text-amber-400 font-bold ml-0.5">(${item.home_odd})</span> 
                                <span class="text-slate-600 mx-1">/</span> 
                                ${item.away_prob}% <span class="text-xs text-amber-400 font-bold ml-0.5">(${item.away_odd})</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadData();
        setInterval(loadData, 20000); // განახლება ყოველ 20 წამში
    </script>
</body>
</html>
